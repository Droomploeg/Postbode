name: Bug report
description: Report a problem with Postbode
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can.

        **Do not report security vulnerabilities here.** See [SECURITY.md](https://github.com/Droomploeg/Postbode/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Postbode version
      description: Release tag, commit SHA, or branch.
      placeholder: "v0.1.0 or commit abc1234"
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.100"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development (dotnet run)
        - Local development (Aspire AppHost)
        - Azure App Service
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste any relevant logs, stack traces, or screenshots.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help.
