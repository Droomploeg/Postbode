name: CI

on:
  push:
    branches: [main, feature/*, bugfix/*]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Run JavaScript actions on Node.js 24 ahead of the June 2026 default
  # cutover. Removes the Node.js 20 deprecation notice on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --settings tests/Droomploeg.DreamOps.Aspire.Tests/coverage.runsettings --logger "trx;LogFileName=test-results.trx"
        env:
          DOTNET_RUNNING_IN_CONTAINER: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages
        run: |
          echo "Scanning for vulnerable packages..."
          VULNERABLE=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$VULNERABLE"
          if echo "$VULNERABLE" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected!"
            exit 1
          fi
          echo "No vulnerable packages found."

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, vulnerability-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build with version
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} -p:InformationalVersion=${{ steps.version.outputs.VERSION }}

      - name: Publish
        run: dotnet publish src/Droomploeg.DreamOps.WebApp/Droomploeg.DreamOps.WebApp.csproj --no-build --configuration Release --output ./publish

      - name: Package artifact
        run: cd publish && zip -r ../dreamops-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: DreamOps ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dreamops-${{ steps.version.outputs.VERSION }}.zip
