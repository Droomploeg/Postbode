name: Feature request
description: Suggest a new feature or enhancement for DreamOps
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement. Please describe the problem you are trying to solve, not just the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or enhancement you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why did you reject them?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of DreamOps does this affect?
      options:
        - Queues
        - Topics / Subscriptions
        - Dead-letter management
        - Background jobs / workers
        - Audit logging
        - Authentication / authorization
        - UI / Blazor components
        - Infrastructure (Bicep)
        - CI/CD
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references, or any other context.
